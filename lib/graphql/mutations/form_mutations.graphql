mutation CreateFPO($name: String!, $email: String!, $phone: String!, $addressLine1: String!, $addressLine2: String, $city: String!, $district: String!, $state: String!, $pincode: String!, $alternatePhone: String, $logo: String) {
  createFpo(name: $name, email: $email, phone: $phone, addressLine1: $addressLine1, addressLine2: $addressLine2, city: $city, district: $district, state: $state, pincode: $pincode, alternatePhone: $alternatePhone, logo: $logo) {
    success
    errors
    fpo {
      id
      name
      email
      phone
      addressLine1
      addressLine2
      city
      district
      state
      pincode
      alternatePhone
      logo
      isActive
      verificationStatus
      verificationNotes
      createdAt
      updatedAt
    }
  }
}
