mutation SubmitBasicDetails($input: FPODetailsSubmissionInput!, $financialYear: String!, $fpoId: ID!) {
  createFpoDetailsSubmission(input: $input, financialYear: $financialYear, fpoId: $fpoId) {
    success
    errors
    submission {
      id
      nameOfProducerOrganization
      registeredAddress
      district
      state
      typeOfProducerOrganization
      dateOfIncorporation
      dateOfCommencement
      ageOfFpoYears
      typeOfFpo
      sizeOfFpoFy2324
      sizeOfFpoFy2223
      sizeOfFpoFy2122
      farmersTransacted
      womenMembers
      targetSizeOfFpo
      dealsThroughPgsFigs
      numPgsFigs
      promotingAgencyName
      typeOfPromotingAgency
      otherPromotingAgencyType
      receivedGrants
      grantMakingOrganization
      supportedByPromotingAgency
    }
  }
}

