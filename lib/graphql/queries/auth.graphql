mutation SignIn($username: String!, $password: String!) {
  signIn(username: $username, password: $password) {
    token
    refreshToken
    payload
    refreshExpiresIn
    __typename
  }
  __typename
}

mutation CreateAccount(
  $username: String!
  $email: String!
  $password: String!
  $firstName: String
  $lastName: String
) {
  createAccount(
    username: $username
    email: $email
    password: $password
    firstName: $firstName
    lastName: $lastName
  ) {
    success
    message
    user {
      id
      username
      email
      firstName
      lastName
    }
  }
}

mutation RefreshToken($refreshToken: String!) {
  refreshToken(refreshToken: $refreshToken) {
    token
    refreshToken
    payload
    refreshExpiresIn
    __typename
  }
  __typename
}

mutation Logout {
  logout {
    deleted
    __typename
  }
  __typename
}

query Me {
  me {
    id
    username
    email
    firstName
    lastName
    isActive
    isStaff
    __typename
  }
  __typename
}
