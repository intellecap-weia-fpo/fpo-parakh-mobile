query GetSubmission($financialYear: String!, $fpoId: ID!) {
  getSubmission(financialYear: $financialYear, fpoId: $fpoId) {
    id
    financialYear
    status
    submittedAt
    calculatedScore
    governanceScore
    businessScore
    processScore
    financialScore
    fpoDetails {
      id
      nameOfProducerOrganization
      registeredAddress
      district
      state
      typeOfProducerOrganization
      dateOfIncorporation
      dateOfCommencement
      ageOfFpoYears
      typeOfFpo
      sizeOfFpoFy2324
      sizeOfFpoFy2223
      sizeOfFpoFy2122
      farmersTransacted
      womenMembers
      targetSizeOfFpo
      dealsThroughPgsFigs
      numPgsFigs
      promotingAgencyName
      typeOfPromotingAgency
      otherPromotingAgencyType
      receivedGrants
      grantMakingOrganization
      supportedByPromotingAgency
    }
    governance {
      id
      annualGeneralBodyMeetings
      bodMeetingsLastFinancialYear
      numBods
      numWomenBods
      minutesMaintenance
      secondLineManagement
    }
    ceoProfile {
      id
      name
      qualification
      totalYearsOfExperience
      typeOfExperience
      numberOfYearsAssociated
    }
    boardDirectors {
      edges {
        node {
          id
          name
          educationalQualification
          totalYearsOfExperience
          typeOfExperience
        }
      }
    }
    businessOperations {
      id
      priceVolatilityOfProducts
      accessibilityPercentage
      availabilityOfInputsTimeliness
      availabilityOfInputsPriceAffordability
      availabilityOfInputsPlace
      distanceOfOutputCollectionCentres
      electronicWeighingMachines
      transportationFacility
      storage
      cleaning
      gradingAndSorting
      chilling
      packaging
      labelling
      processing
      qualityCheck
      soilTestingFacility
      customHiringCenters
      contractFarming
      advisoryServices
      creditFacilities
    }
    complianceDetails {
      id
      actUnderRegistered
      dateOfRegistration
      permanentAccountNumber
      placeOfRegistration
      registrationNo
      taxAccountNumber
      incorporationDate
      incorporationPlace
      incorporationRegNo
      commencementDate
      commencementPlace
      commencementRegNo
      gstDate
      gstPlace
      gstRegNo
    }
    processesSystems {
      id
      accountsAndMis
      booksAndRecordsUpToDate
      creditRecordOfFpo
      insuranceOfStock
      penaltiesLeviedBoardMeeting
      reconciliationOfStocks
      statutoryFillings
    }
    financialDetails: financialDetailsV2 {
      id
      cashChequePercentage
      createdAt
      creditDefaultAmount
      creditDefaultLender
      creditDefaultYear
      currentYearAccountsPayable
      currentYearAccountsReceivable
      currentYearAssets
      loanDetails
      currentYearClosingInventory
      currentYearCogs
      currentYearCurrentAssets
      currentYearCurrentLiabilities
      currentYearGrossProfit
      currentYearInstitutionalProducts
      currentYearInstitutionalRevenue
      currentYearLenderName
      currentYearLiabilities
      currentYearLoanAmount
      currentYearMatchingGrant
      currentYearNetProfit
      currentYearOpeningInventory
      currentYearProducts
      currentYearProjectGrant
      currentYearQuantityProcured
      currentYearQuantityProducts
      currentYearRetailProducts
      currentYearRetailRevenue
      currentYearRevenue
      currentYearShareCapital
      currentYearShareholders
      currentYearWholesaleProducts
      currentYearWholesaleRevenue
      daysPayableReceivableDifference
      grossNetProfitMarginDifference
      id
      institutionalLendingHistory
      operatingMarginCurrentYear
      previousYearAccountsPayable
      previousYearAccountsReceivable
      previousYearAssets
      previousYearClosingInventory
      previousYearCogs
      previousYearCurrentAssets
      previousYearCurrentLiabilities
      previousYearGrossProfit
      previousYearInstitutionalProducts
      previousYearInstitutionalRevenue
      previousYearLenderName
      previousYearLiabilities
      previousYearLoanAmount
      previousYearMatchingGrant
      previousYearNetProfit
      previousYearOpeningInventory
      previousYearProducts
      previousYearProjectGrant
      previousYearQuantityProcured
      previousYearQuantityProducts
      previousYearRetailProducts
      previousYearRetailRevenue
      previousYearRevenue
      previousYearShareCapital
      previousYearShareholders
      previousYearWholesaleProducts
      previousYearWholesaleRevenue
      targetRevenue
      totalDebtToday
      twoYearsBackAccountsPayable
      twoYearsBackAccountsReceivable
      twoYearsBackAssets
      twoYearsBackClosingInventory
      twoYearsBackCogs
      twoYearsBackCurrentAssets
      twoYearsBackCurrentLiabilities
      twoYearsBackGrossProfit
      twoYearsBackInstitutionalProducts
      twoYearsBackInstitutionalRevenue
      twoYearsBackLenderName
      twoYearsBackLiabilities
      twoYearsBackLoanAmount
      twoYearsBackMatchingGrant
      twoYearsBackNetProfit
      twoYearsBackOpeningInventory
      twoYearsBackProducts
      twoYearsBackProjectGrant
      twoYearsBackQuantityProcured
      twoYearsBackQuantityProducts
      twoYearsBackRetailProducts
      twoYearsBackRetailRevenue
      twoYearsBackRevenue
      twoYearsBackShareCapital
      twoYearsBackShareholders
      twoYearsBackWholesaleProducts
      twoYearsBackWholesaleRevenue
      updatedAt
    }
    sustainableActivities {
      id
      climateResilientSeedsToFarmers
      compostingUnitsAtFpoLevel
      dripSprinklerIrrigationToFarmers
      establishmentOfRainwaterHarvestingAtFpoLevel
      organicBioManureFertilizersToFarmers
      pestDiseaseAlertsToFarmers
      solarPanelsAtFpoLevel
      supplyingAgriculturalResidueToBioCngGasPlants
      trainingOnOrganicFarmingToFarmers
      weatherAdvisoriesToFarmers
    }
  }
}

query GetAllMyFpos {
  allMyFpos {
    edges {
      node {
        id
        name
        email
        district
        state
        isActive
        verificationStatus
        verificationNotes
      }
    }
  }
}

query GetMyFpo {
  myFpo {
    id
    name
    email
    phone
    addressLine1
    addressLine2
    city
    district
    state
    pincode
    alternatePhone
    logo
    isActive
    verificationStatus
    verificationNotes
    createdAt
    updatedAt
  }
}
